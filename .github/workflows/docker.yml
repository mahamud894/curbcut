name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/mahamud894/curbcut:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Curbcut with docker compose
        env:
          CURBCUT_ALLOW_PRIVATE_NETWORKS: 'true'
          CURBCUT_REGISTRATION: 'false'
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          docker compose ps

      - name: Web app answers
        run: |
          curl -fsS http://localhost:8080/up > /dev/null
          curl -fsS http://localhost:8080/ | grep -q 'Curbcut'
          curl -fsS http://localhost:8080/login > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/register)
          test "$code" = "404" || { echo "sign-up should be closed, got $code"; exit 1; }

      - name: Create a user, add a site and scan it through the queue
        run: |
          docker run -d --name fixtures --network "$(basename "$PWD")_default" \
            -v "$PWD/tests/fixtures/site:/usr/share/nginx/html:ro" nginx:alpine
          docker compose exec -T app php artisan curbcut:user ci@example.com --name=CI --password=ci-password-123
          docker compose exec -T app php artisan tinker --execute '
            $u = App\Models\User::where("email", "ci@example.com")->first();
            $s = $u->sites()->create(["organization_id" => $u->workspace()->id, "name" => "Fixture", "url" => "http://fixtures/", "max_pages" => 5, "scan_frequency" => "manual"]);
            echo "site ", $s->id, PHP_EOL;'
          docker compose exec -T app php artisan curbcut:scan 1
          for i in $(seq 1 60); do
            status=$(docker compose exec -T app php artisan tinker --execute 'echo App\Models\Scan::latest("id")->value("status");' | tail -n1 | tr -d '\r')
            echo "scan: $status"
            [ "$status" = "completed" ] && break
            [ "$status" = "failed" ] && break
            sleep 3
          done
          docker compose exec -T app php artisan tinker --execute '
            $scan = App\Models\Scan::latest("id")->first();
            $issues = App\Models\Issue::count();
            echo "status=", $scan->status, " pages=", $scan->pages_scanned, " score=", $scan->score, " issues=", $issues, PHP_EOL;
            if ($scan->status !== "completed" || $scan->pages_scanned < 2 || $issues < 4) { exit(1); }'

      - name: Sign in and download the PDF audit report over HTTP
        run: |
          jar=$(mktemp)
          curl -fsS -c "$jar" -b "$jar" http://localhost:8080/login > /dev/null
          token=$(awk '$6 == "XSRF-TOKEN" { print $7 }' "$jar" | python3 -c 'import sys, urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))')
          curl -fsS -c "$jar" -b "$jar" -H "X-XSRF-TOKEN: $token" -H 'Accept: text/html' \
            --data-urlencode email=ci@example.com --data-urlencode password=ci-password-123 \
            -o /dev/null -w 'login: %{http_code} -> %{redirect_url}\n' http://localhost:8080/login
          curl -fsS -b "$jar" -o report.pdf -w 'report: %{http_code} %{content_type} %{size_download} bytes\n' http://localhost:8080/sites/1/report
          head -c 5 report.pdf | grep -q '%PDF-'
          python3 - <<'PY'
          data = open('report.pdf', 'rb').read()
          assert b'/MarkInfo' in data and b'/StructTreeRoot' in data, 'PDF is not tagged'
          print('tagged PDF OK')
          PY

      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail=200

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mahamud894/curbcut:latest
            ghcr.io/mahamud894/curbcut:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
